<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-zinc-50 dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 font-sans antialiased selection:bg-zinc-900 selection:text-white dark:selection:bg-zinc-100 dark:selection:text-zinc-900 flex h-screen overflow-hidden transition-colors duration-150">

  <!-- LEFT SIDEBAR -->
  <aside class="w-72 bg-white dark:bg-[#0c0c0e] border-r border-zinc-200 dark:border-zinc-800/80 flex flex-col h-full shrink-0 select-none">
    <div class="p-5 border-b border-zinc-200 dark:border-zinc-800/80">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-6 h-6 rounded bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 flex items-center justify-center font-mono text-xs font-semibold" id="course-logo"></div>
          <div>
            <span class="font-semibold text-sm tracking-tight text-zinc-900 dark:text-zinc-100 block leading-none" id="course-name"></span>
            <span class="text-[10px] font-mono text-zinc-400 dark:text-zinc-500" id="course-tagline"></span>
          </div>
        </div>
        <span class="text-[10px] font-mono uppercase px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400 border border-zinc-200 dark:border-zinc-700/60" id="course-duration"></span>
      </div>

      <div class="mt-5">
        <div class="flex justify-between items-baseline text-xs mb-1.5">
          <span class="text-zinc-500 dark:text-zinc-400 font-medium">Course Mastery</span>
          <span id="progress-percentage" class="font-mono text-[11px] font-medium text-zinc-700 dark:text-zinc-300">0%</span>
        </div>
        <div class="w-full h-1 bg-zinc-100 dark:bg-zinc-800 rounded-full overflow-hidden">
          <div id="progress-bar" class="h-full bg-zinc-900 dark:bg-zinc-100 transition-all duration-300" style="width: 0%"></div>
        </div>
        <div class="flex justify-between items-center mt-2">
          <span id="progress-count" class="text-[11px] text-zinc-400 dark:text-zinc-500 font-mono">0/0 completed</span>
          <button id="reset-progress-btn" disabled class="text-[11px] text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 transition">Reset</button>
        </div>
      </div>
    </div>

    <div class="px-3 pt-3 pb-1 flex items-center justify-between text-[10px] font-mono uppercase tracking-wider text-zinc-400 dark:text-zinc-500">
      <span>Curriculum</span>
      <span>Mode</span>
    </div>
    <nav id="module-nav" class="flex-1 overflow-y-auto px-2 pb-4 space-y-0.5"></nav>

    <div class="p-3.5 border-t border-zinc-200 dark:border-zinc-800/80 text-[11px] text-zinc-400 dark:text-zinc-500 flex items-center justify-between font-mono">
      <span>Saved in browser</span>
      <span class="flex items-center gap-1.5 text-zinc-600 dark:text-zinc-400">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Ready
      </span>
    </div>
  </aside>

  <!-- MAIN WORKSPACE -->
  <main class="flex-1 min-w-0 flex flex-col h-full overflow-hidden">
    <header class="h-14 border-b border-zinc-200 dark:border-zinc-800/80 px-8 flex items-center justify-between shrink-0 bg-white/80 dark:bg-[#09090b]/80 backdrop-blur-md z-10">
      <div class="flex items-center gap-2 text-xs text-zinc-500 dark:text-zinc-400 truncate">
        <span id="header-week-badge" class="font-mono text-[11px] text-zinc-600 dark:text-zinc-400"></span>
        <span class="text-zinc-300 dark:text-zinc-700">/</span>
        <span id="header-mode-badge" class="font-mono text-[10px] px-1.5 py-0.5 rounded border border-zinc-200 dark:border-zinc-800"></span>
        <span class="text-zinc-300 dark:text-zinc-700">/</span>
        <span id="header-title" class="font-medium text-zinc-900 dark:text-zinc-100 truncate"></span>
      </div>

      <div class="flex items-center gap-2">
        <button id="theme-btn" disabled class="p-1.5 rounded-md border border-zinc-200 dark:border-zinc-800 text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800/60 transition" title="Toggle Light/Dark Theme">
          <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>
          <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>
        </button>
        <div class="h-4 w-[1px] bg-zinc-200 dark:bg-zinc-800 mx-1"></div>
        <button id="prev-btn" disabled class="px-2.5 py-1 rounded-md border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-800/60 text-xs font-medium text-zinc-700 dark:text-zinc-300 transition disabled:opacity-30 disabled:pointer-events-none">Previous</button>
        <button id="next-btn" disabled class="px-2.5 py-1 rounded-md bg-zinc-900 dark:bg-zinc-100 hover:bg-zinc-800 dark:hover:bg-zinc-200 text-xs font-medium text-white dark:text-zinc-900 transition disabled:opacity-30 disabled:pointer-events-none">Next &rarr;</button>
      </div>
    </header>

    <div id="lesson-container" class="flex-1 overflow-y-auto px-8 py-10" aria-live="polite"><p role="status">Loading course…</p></div>
    <noscript>Enable JavaScript to view this course.</noscript>
  </main>

  <script src="vendor/prism.js" data-manual defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
